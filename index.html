<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PollinChat</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script type="importmap">
        {
          "imports": {
            "marked": "https://esm.sh/marked",
            "highlight.js": "https://esm.sh/highlight.js"
          }
        }
      </script>
    <script>
        // Apply theme immediately to prevent flickering
        (function() {
            try {
                const settings = JSON.parse(localStorage.getItem('pollinations_settings'));
                if (settings && settings.theme) {
                    const theme = settings.theme;
                    if (theme === 'system') {
                        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        document.documentElement.className = isDark ? 'dark-theme' : 'light-theme';
                    } else {
                        document.documentElement.className = theme + '-theme';
                    }
                } else {
                    document.documentElement.className = 'light-theme';
                }
            } catch(e) {
                document.documentElement.className = 'light-theme';
            }
        })();
        
        // Apply default model immediately to prevent flickering
        (function() {
            try {
                const settings = JSON.parse(localStorage.getItem('pollinations_settings'));
                if (settings && settings.defaultModel) {
                    // Set model before page fully loads
                    window.addEventListener('DOMContentLoaded', function() {
                        const modelSelector = document.getElementById('modelSelector');
                        if (modelSelector) {
                            modelSelector.value = settings.defaultModel;
                        }
                    });
                }
            } catch(e) {
                // Ignore errors
            }
        })();
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar closed" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <i class="fas fa-plus"></i> New Chat
                </button>
                <button class="close-sidebar-btn" id="closeSidebarBtn" title="Close Sidebar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="chat-history-container">
                <div class="history-label">Recent Chats</div>
                <div class="chat-history" id="chatHistory">
                    <!-- Chat items will be injected here -->
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="delete-all-sidebar-btn" id="deleteAllSidebarBtn">
                    <i class="fas fa-trash-alt"></i> Clear All
                </button>
                <button class="settings-btn" id="settingsBtn">
                    <i class="fas fa-cog"></i> Settings
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="model-selector-container">
                    <div id="toolControls" class="tool-controls">
                        <button id="searchToggle" class="tool-toggle-btn" title="Enable Google Search" style="display: none;">
                            <i class="fas fa-search"></i>
                        </button>
                        <button id="codeToggle" class="tool-toggle-btn" title="Enable Code Execution" style="display: none;">
                            <i class="fas fa-terminal"></i>
                        </button>
                    </div>
                    <div id="reasoningControls" class="reasoning-controls" style="display: none;">
                        <label class="switch-container" id="thinkingToggleContainer">
                            <span class="label-text">Thinking</span>
                            <input type="checkbox" id="thinkingToggle" checked>
                            <span class="slider"></span>
                        </label>
                        <select id="reasoningEffort" class="effort-select" style="display: none;">
                            <option value="none">None</option>
                            <option value="minimal">Minimal</option>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="xhigh">X-High</option>
                        </select>
                    </div>
                    <select id="modelSelector" class="model-select">
                        <option value="openai">OpenAI GPT-5 Mini</option>
                        <option value="openai-large">OpenAI GPT-5.2</option>
                        <option value="openai-fast">OpenAI GPT-5 Nano</option>
                        <option value="claude">Anthropic Claude Sonnet 4.5</option>
                        <option value="claude-large">Anthropic Claude Opus 4.5</option>
                        <option value="claude-fast">Anthropic Claude Haiku 4.5</option>
                        <option value="gemini">Google Gemini 3 Flash</option>
                        <option value="gemini-large">Google Gemini 3 Pro</option>
                        <option value="gemini-fast">Google Gemini 2.5 Flash Lite</option>
                        <option value="gemini-search">Google Gemini 3 Flash</option>
                        <option value="mistral">Mistral Small 3.2 24B</option>
                        <option value="grok">xAI Grok 4 Fast</option>
                        <option value="qwen-coder">Qwen3 Coder 30B</option>
                        <option value="perplexity-fast">Perplexity Sonar</option>
                        <option value="perplexity-reasoning">Perplexity Sonar Reasoning</option>
                        <option value="nova-micro">Amazon Nova Micro</option>
                        <option value="chickytutor">ChickyTutor AI Language Tutor</option>
                        <option value="deepseek">DeepSeek V3.2</option>
                        <option value="kimi-k2-thinking">Moonshot Kimi K2 Thinking</option>
                        <option value="midjourney">MIDjourney</option>
                    </select>
                </div>
                <div class="top-bar-actions">
                    <!-- Actions like export/share could go here -->
                </div>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-content">
                        <div class="logo-container">
                            <img src="logo.png" alt="Pollinations AI" class="welcome-logo">
                        </div>
                        <h1>PollinChat</h1>
                        <div class="suggestions">
                            <button class="suggestion-card" onclick="setInput('Write a Python script to scrape a website.')">
                                <i class="fas fa-code"></i>
                                <div class="suggestion-text">
                                    <p>Write a script</p>
                                    <span>to scrape a website</span>
                                </div>
                            </button>
                            <button class="suggestion-card" onclick="setInput('Explain quantum computing in simple terms.')">
                                <i class="fas fa-lightbulb"></i>
                                <div class="suggestion-text">
                                    <p>Explain</p>
                                    <span>quantum computing</span>
                                </div>
                            </button>
                            <button class="suggestion-card" onclick="setInput('Help me write a professional email about a project delay.')">
                                <i class="fas fa-pen-nib"></i>
                                <div class="suggestion-text">
                                    <p>Write an email</p>
                                    <span>about a project delay</span>
                                </div>
                            </button>
                            <button class="suggestion-card" onclick="setInput('Create a 7-day keto meal plan.')">
                                <i class="fas fa-utensils"></i>
                                <div class="suggestion-text">
                                    <p>Plan a meal</p>
                                    <span>7-day keto diet</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="messages-list" id="messagesList"></div>
            </div>

            <footer class="input-area">
                <div class="input-wrapper">
                    <div id="imagePreviewContainer" class="image-preview-container"></div>
                    <div class="input-row">
                        <button id="attachBtn" class="attach-btn" title="Attach image">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                        <textarea id="chatInput" placeholder="Message PollinChat..." rows="1"></textarea>
                        <button id="sendBtn" class="send-btn" disabled>
                            <i class="fas fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
                <p class="disclaimer">Powered by Pollinations.ai. LLMs can make mistakes. Verify important info.</p>
            </footer>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-modal" id="closeSettings"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="apiKey">Pollinations API Key</label>
                    <input type="password" id="apiKey" placeholder="Enter your API Key (Required)">
                    <small>Get yours at <a href="https://pollinations.ai" target="_blank">pollinations.ai</a></small>
                </div>
                <div class="setting-group">
                    <label for="themeSelect">Theme</label>
                    <select id="themeSelect">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                        <option value="system">System</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="defaultModelSelect">Default Model</label>
                    <select id="defaultModelSelect">
                        <option value="openai">OpenAI GPT-5 Mini</option>
                        <option value="openai-large">OpenAI GPT-5.2</option>
                        <option value="openai-fast">OpenAI GPT-5 Nano</option>
                        <option value="claude">Anthropic Claude Sonnet 4.5</option>
                        <option value="claude-large">Anthropic Claude Opus 4.5</option>
                        <option value="claude-fast">Anthropic Claude Haiku 4.5</option>
                        <option value="gemini">Google Gemini 3 Flash</option>
                        <option value="gemini-large">Google Gemini 3 Pro</option>
                        <option value="gemini-fast">Google Gemini 2.5 Flash Lite</option>
                        <option value="gemini-search">Google Gemini 3 Flash</option>
                        <option value="mistral">Mistral Small 3.2 24B</option>
                        <option value="grok">xAI Grok 4 Fast</option>
                        <option value="qwen-coder">Qwen3 Coder 30B</option>
                        <option value="perplexity-fast">Perplexity Sonar</option>
                        <option value="perplexity-reasoning">Perplexity Sonar Reasoning</option>
                        <option value="nova-micro">Amazon Nova Micro</option>
                        <option value="chickytutor">ChickyTutor AI Language Tutor</option>
                        <option value="deepseek">DeepSeek V3.2</option>
                        <option value="kimi-k2-thinking">Moonshot Kimi K2 Thinking</option>
                        <option value="midjourney">MIDjourney</option>
                    </select>
                </div>

            </div>
            <div class="modal-footer">
                <button class="save-btn" id="saveSettings">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
